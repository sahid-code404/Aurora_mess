name: Apply Phase 10 Billing Integrity Patch

on:
  push:
    branches:
      - feat/financial-integrity-hardening
    paths:
      - scripts/patch-phase10-billing.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/financial-integrity-hardening
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch billing domain
        run: python3 scripts/patch-phase10-billing.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/domain/billing.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: harden billing reconciliation and provenance"
          git push origin HEAD:feat/financial-integrity-hardening
