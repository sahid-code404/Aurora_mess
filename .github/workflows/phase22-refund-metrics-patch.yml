name: Phase 22 refund metric patch

on:
  push:
    branches: [fix/phase22-refund-kpi-semantics]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase22-refund-kpi-semantics
          fetch-depth: 0

      - name: Apply refund metric patch
        run: python3 scripts/phase22-refund-metrics-patch.py

      - name: Typecheck patched tree
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/v1/admin/payments/route.ts \
                  src/app/api/v1/payments/route.ts \
                  src/app/api/v1/refunds/route.ts \
                  src/app/api/v1/admin/refunds/route.ts \
                  src/lib/domain/formula/providers/payment.ts \
                  src/lib/domain/formula/variables.ts \
                  src/components/app/admin/payments.tsx \
                  src/components/app/resident/payments.tsx \
                  src/components/app/resident/_shared/types.ts \
                  tests/seeded-refund-center-smoke.py
          git commit -m "Phase 22: separate cash refunds from carry-forward metrics"
          git push origin HEAD:fix/phase22-refund-kpi-semantics
