name: Phase 22 final task copy correction

on:
  push:
    branches: [feat/phase22-normal-task-lifecycle]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase22-normal-task-lifecycle
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - name: Correct task review copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/app/admin/tasks.tsx')
          text = p.read_text()
          old = '      toast.success(kind === "approve" ? "Expense created and posted" : "Submission rejected", {\n          description: `${task.residentName} · ${task.description}`,\n        }\n      );'
          new = '      toast.success(\n        kind === "approve"\n          ? task.taskType === "MARKET_PURCHASE"\n            ? "Expense created and posted"\n            : "Normal task completion approved"\n          : "Submission rejected",\n        { description: `${task.residentName} · ${task.description}` }\n      );'
          if old not in text:
              raise SystemExit('review-card toast pattern not found')
          text = text.replace(old, new, 1)
          old2 = '                {task.residentName} is notified with your reason and can resubmit corrected items.'
          new2 = '                {task.residentName} is notified with your reason. This submission closes; assign a new task if the work must be retried.'
          if old2 not in text:
              raise SystemExit('misleading rejection copy pattern not found')
          text = text.replace(old2, new2, 1)
          old3 = '        {\n        description: `${currentTask.residentName} · ${currentTask.description}`,\n      });'
          new3 = '        { description: `${currentTask.residentName} · ${currentTask.description}` }\n      );'
          if old3 not in text:
              raise SystemExit('detail toast formatting pattern not found')
          p.write_text(text.replace(old3, new3, 1))
          PY
      - run: bunx prisma generate
      - run: bunx tsc --noEmit
      - run: bunx eslint src/components/app/admin/tasks.tsx
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/app/admin/tasks.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Phase 22: align task review lifecycle copy"
          git push origin HEAD:feat/phase22-normal-task-lifecycle
