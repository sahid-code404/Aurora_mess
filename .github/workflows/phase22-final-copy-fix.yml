name: Phase 22 final task copy correction

on:
  push:
    branches: [feat/phase22-normal-task-lifecycle]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase22-normal-task-lifecycle
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - name: Correct task review copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/app/admin/tasks.tsx')
          text = p.read_text()
          old = '''      toast.success(kind === "approve" ? "Expense created and posted" : "Submission rejected", {
          description: `${task.residentName} · ${task.description}`,
        }
      );'''
          new = '''      toast.success(
        kind === "approve"
          ? task.taskType === "MARKET_PURCHASE"
            ? "Expense created and posted"
            : "Normal task completion approved"
          : "Submission rejected",
        { description: `${task.residentName} · ${task.description}` }
      );'''
          if old not in text:
              raise SystemExit('review-card toast pattern not found')
          text = text.replace(old, new, 1)
          old2 = '''                {task.residentName} is notified with your reason and can resubmit corrected items.'''
          new2 = '''                {task.residentName} is notified with your reason. This submission closes; assign a new task if the work must be retried.'''
          if old2 not in text:
              raise SystemExit('misleading rejection copy pattern not found')
          text = text.replace(old2, new2, 1)
          # Normalize the detail-dialog toast indentation introduced by the scoped transform.
          old3 = '''        {
        description: `${currentTask.residentName} · ${currentTask.description}`,
      });'''
          new3 = '''        { description: `${currentTask.residentName} · ${currentTask.description}` }
      );'''
          if old3 not in text:
              raise SystemExit('detail toast formatting pattern not found')
          text = text.replace(old3, new3, 1)
          p.write_text(text)
          PY
      - run: bunx prisma generate
      - run: bunx tsc --noEmit
      - run: bunx eslint src/components/app/admin/tasks.tsx
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/app/admin/tasks.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Phase 22: align task review lifecycle copy"
          git push origin HEAD:feat/phase22-normal-task-lifecycle
