name: Phase 18 scoped patch

on:
  push:
    branches:
      - feat/phase18-flow-logic-polish

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase18-flow-logic-polish
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Update existing refund regression
        run: python3 .github/phase18_test_patch.py
      - name: Validate TypeScript
        run: |
          bun install --frozen-lockfile
          bun run db:generate
          bunx tsc --noEmit
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "Phase 18: update refund concurrency regression"
          git push origin HEAD:feat/phase18-flow-logic-polish
