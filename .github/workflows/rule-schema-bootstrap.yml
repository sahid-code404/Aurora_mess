name: Bootstrap Versioned Rule Schema

on:
  push:
    branches:
      - feat/versioned-rule-persistence

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: boardops
          POSTGRES_DB: boardops_rule_schema
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boardops -d boardops_rule_schema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://boardops@127.0.0.1:5432/boardops_rule_schema?schema=public

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/versioned-rule-persistence
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate and commit Rule schema migration
        run: bash scripts/bootstrap-rule-schema.sh
