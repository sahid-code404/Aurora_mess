name: Bootstrap Versioned Rule Schema

on:
  push:
    branches:
      - feat/versioned-rule-persistence

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: boardops
          POSTGRES_DB: boardops_rule_schema
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boardops -d boardops_rule_schema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://boardops@127.0.0.1:5432/boardops_rule_schema?schema=public

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/versioned-rule-persistence
          fetch-depth: 0

      - name: Stop when schema is already generated
        id: existing
        run: |
          if grep -q '^model RuleDefinition {' prisma/schema.prisma; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.existing.outputs.done != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        if: steps.existing.outputs.done != 'true'
        run: bun install --frozen-lockfile

      - name: Add versioned Rule models
        if: steps.existing.outputs.done != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('prisma/schema.prisma')
          text = path.read_text()
          marker = '// ---------------------------------------------------------------------\n// Formula engine (versioned, safe AST, DAG dependencies)\n// ---------------------------------------------------------------------\n'
          block = '''// ---------------------------------------------------------------------
// Minimal Rule Engine — versioned deterministic policy rule sets
// ---------------------------------------------------------------------

model RuleDefinition {
  id            String   @id @default(cuid())
  institutionId String
  key           String
  name          String
  description   String?
  policyType    String
  status        String   @default("ACTIVE") // ACTIVE | ARCHIVED
  createdAt     DateTime @default(now())
  updatedAt     DateTime @updatedAt

  versions RuleVersion[]

  @@unique([institutionId, key])
  @@index([institutionId, policyType, status])
}

model RuleVersion {
  id               String    @id @default(cuid())
  ruleDefinitionId String
  version          Int
  rulesJson        String // validated StructuredDecisionRule[] JSON; never executable code
  checksum         String
  effectiveFrom    DateTime?
  effectiveUntil   DateTime?
  status           String    @default("DRAFT") // DRAFT | ACTIVE | SCHEDULED | HISTORICAL
  createdByUserId  String?
  reason           String?
  createdAt        DateTime  @default(now())

  definition RuleDefinition @relation(fields: [ruleDefinitionId], references: [id], onDelete: Cascade)

  @@unique([ruleDefinitionId, version])
  @@index([ruleDefinitionId, status, effectiveFrom])
}

'''
          if marker not in text:
              raise SystemExit('Formula-engine schema marker not found')
          path.write_text(text.replace(marker, block + marker, 1))
          PY
          bunx prisma format
          bunx prisma validate

      - name: Apply current committed migrations
        if: steps.existing.outputs.done != 'true'
        run: bunx prisma migrate deploy

      - name: Generate additive Rule migration from schema diff
        if: steps.existing.outputs.done != 'true'
        run: |
          mkdir -p prisma/migrations/20260905_010000_add_rule_engine
          bunx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script > prisma/migrations/20260905_010000_add_rule_engine/migration.sql
          test -s prisma/migrations/20260905_010000_add_rule_engine/migration.sql

      - name: Commit generated schema and migration
        if: steps.existing.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma prisma/migrations/20260905_010000_add_rule_engine/migration.sql
          git commit -m "infra: add versioned Rule models and migration [rule-schema-generated]"
          git push origin HEAD:feat/versioned-rule-persistence
