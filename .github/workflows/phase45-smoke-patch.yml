name: Phase 45 Refund Center smoke patch

on:
  push:
    branches:
      - feat/phase45-refund-correction-lifecycle
    paths:
      - scripts/phase45_smoke_patch.py
      - .github/workflows/phase45-smoke-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase45-refund-correction-lifecycle
          fetch-depth: 0
      - name: Apply guarded smoke extension
        run: python3 scripts/phase45_smoke_patch.py
      - name: Commit smoke extension
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/seeded-refund-center-smoke.py
          git commit -m "Phase 45: extend Refund Center production correction smoke"
          git push origin HEAD:feat/phase45-refund-correction-lifecycle
