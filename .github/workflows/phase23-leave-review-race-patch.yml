name: Phase 23 leave review race patch

on:
  push:
    branches: [feat/phase23-leave-lifecycle]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase23-leave-lifecycle
          fetch-depth: 0

      - name: Apply review transition guards
        run: python3 scripts/phase23-leave-review-race-patch.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Validate patched TypeScript
        run: |
          bun install --frozen-lockfile
          bunx prisma generate
          bunx tsc --noEmit

      - name: Commit patch if valid
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/api/v1/admin/leave-requests/[id]/approve/route.ts' 'src/app/api/v1/admin/leave-requests/[id]/reject/route.ts'
          git commit -m "Phase 23: guard concurrent leave review transitions"
          git push origin HEAD:feat/phase23-leave-lifecycle
