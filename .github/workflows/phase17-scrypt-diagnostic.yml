name: Phase 17 scrypt diagnostic

on:
  push:
    branches: [test/phase17-seeded-acceptance-v2]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Compare scrypt async paths
        run: bun scripts/diagnose-scrypt.ts
