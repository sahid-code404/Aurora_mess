name: Phase 19 cookie harness patch

on:
  push:
    branches:
      - test/phase19-business-flow-acceptance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/phase19-business-flow-acceptance
          fetch-depth: 0
      - name: Align Python smoke with production secure-cookie transport
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/seeded-business-flow-smoke.py')
          text = path.read_text()
          text = text.replace('from http.cookiejar import CookieJar\n', '')
          text = text.replace(
              'from urllib.request import HTTPCookieProcessor, Request, build_opener\n',
              'from urllib.request import Request, build_opener\n',
          )
          text = text.replace(
              '        self.opener = build_opener(HTTPCookieProcessor(CookieJar()))\n',
              '        self.opener = build_opener()\n        self.session_token: str | None = None\n',
          )
          text = text.replace(
              '        headers = {"Accept": "application/json"}\n        raw: bytes | None = None\n',
              '        headers = {"Accept": "application/json"}\n'
              '        if self.session_token:\n'
              '            headers["Cookie"] = f"mes_session={self.session_token}"\n'
              '        raw: bytes | None = None\n',
          )
          text = text.replace(
              '        req = Request(url, data=raw, headers=headers, method=method.upper())\n'
              '        try:\n'
              '            with self.opener.open(req, timeout=15) as response:\n'
              '                status = response.status\n'
              '                text = response.read().decode("utf-8")\n'
              '        except HTTPError as error:\n'
              '            status = error.code\n'
              '            text = error.read().decode("utf-8", errors="replace")\n',
              '        req = Request(url, data=raw, headers=headers, method=method.upper())\n'
              '        set_cookies: list[str] = []\n'
              '        try:\n'
              '            with self.opener.open(req, timeout=15) as response:\n'
              '                status = response.status\n'
              '                set_cookies = response.headers.get_all("Set-Cookie") or []\n'
              '                text = response.read().decode("utf-8")\n'
              '        except HTTPError as error:\n'
              '            status = error.code\n'
              '            set_cookies = error.headers.get_all("Set-Cookie") or []\n'
              '            text = error.read().decode("utf-8", errors="replace")\n',
          )
          text = text.replace(
              '        try:\n'
              '            payload = json.loads(text) if text else {}\n',
              '        for cookie in set_cookies:\n'
              '            if cookie.startswith("mes_session="):\n'
              '                token = cookie.split(";", 1)[0].split("=", 1)[1]\n'
              '                self.session_token = token or None\n'
              '\n'
              '        try:\n'
              '            payload = json.loads(text) if text else {}\n',
              1,
          )
          text = text.replace(
              '        check(user.get("role") == role, f"{self.label} login returned wrong role")\n'
              '        check("sessionToken" not in json_fingerprint(response.payload), f"{self.label} login leaked sessionToken")\n'
              '        me = self.get("/api/v1/auth/me").data or {}\n',
              '        check(user.get("role") == role, f"{self.label} login returned wrong role")\n'
              '        check("sessionToken" not in json_fingerprint(response.payload), f"{self.label} login leaked sessionToken")\n'
              '        check(bool(self.session_token), f"{self.label} login did not emit mes_session")\n'
              '        me = self.get("/api/v1/auth/me").data or {}\n',
          )
          path.write_text(text)
          PY
          python3 -m py_compile tests/seeded-business-flow-smoke.py
          grep -q 'headers\["Cookie"\] = f"mes_session={self.session_token}"' tests/seeded-business-flow-smoke.py
          ! grep -q 'HTTPCookieProcessor' tests/seeded-business-flow-smoke.py
      - name: Commit harness fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/seeded-business-flow-smoke.py
          if git diff --cached --quiet; then
            echo "No harness changes"
            exit 0
          fi
          git commit -m "Phase 19: handle secure session cookie in localhost smoke"
          git push origin HEAD:test/phase19-business-flow-acceptance
