name: Phase 14 shared rate-limit patch

on:
  push:
    branches: [feat/phase14-operational-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase14-operational-hardening
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/phase14-shared-rate-limit-patch.py

      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma src/app/api/v1/auth/register/route.ts src/app/api/v1/admin/announcements/route.ts src/app/api/v1/admin/ai/proof-preview/route.ts src/app/api/v1/payments/route.ts src/app/api/v1/admin/formulas/preview/route.ts
          git commit -m "Phase 14: wire shared PostgreSQL rate limits"
          git push origin HEAD:feat/phase14-operational-hardening
