name: Phase 63 Finite Policy Exemptions

on:
  push:
    branches:
      - feat/phase63-finite-policy-exemptions
    paths:
      - .github/workflows/phase63-finite-policy-exemptions.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase63-finite-policy-exemptions
          fetch-depth: 0

      - name: Apply finite exemption enforcement
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_phase63_apply.py
          git diff --check
          git status --short

      - name: Commit Phase 63 product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BoardOps Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add prisma src tests
          git commit -m "fix: enforce finite policy exemptions"
          git push origin HEAD:feat/phase63-finite-policy-exemptions
