name: Phase 22 task lifecycle patch

on:
  push:
    branches: [feat/phase22-normal-task-lifecycle]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase22-normal-task-lifecycle
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply Phase 22 patch
        run: |
          python3 scripts/phase22-task-lifecycle-patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/components/app/admin/tasks.tsx")
          text = path.read_text()
          old = 'kind === "approve"\n          ? task.taskType === "MARKET_PURCHASE"'
          new = 'kind === "approve"\n          ? currentTask.taskType === "MARKET_PURCHASE"'
          if old not in text:
              raise SystemExit("expected nullable task type check not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint changed implementation
        run: bunx eslint src/components/app/resident/tasks.tsx src/components/app/admin/tasks.tsx src/app/api/v1/admin/tasks/route.ts src/app/api/v1/admin/task-submissions/[id]/reject/route.ts src/app/api/v1/tasks/[id]/submission/route.ts src/app/api/v1/admin/task-submissions/[id]/approve/route.ts

      - name: Commit permanent changes
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/app/resident/tasks.tsx src/components/app/admin/tasks.tsx src/app/api/v1/admin/tasks/route.ts src/app/api/v1/admin/task-submissions/[id]/reject/route.ts tests/seeded-business-flow-smoke.py
          git commit -m "Phase 22: complete normal task lifecycle"
          git push origin HEAD:feat/phase22-normal-task-lifecycle
