name: Phase 48 seed alignment

on:
  push:
    branches:
      - feat/phase48-meal-instance-temporal-lifecycle
    paths:
      - scripts/phase48_seed_patch.py
      - .github/workflows/phase48-seed-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase48-meal-instance-temporal-lifecycle
          fetch-depth: 0
      - name: Align development seed temporal states
        run: python3 scripts/phase48_seed_patch.py
      - name: Commit seed alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/seed.ts tests/unit/meal-instance-temporal-lifecycle-source.test.ts
          git commit -m "Phase 48: align seeded meal instance states"
          git push origin HEAD:feat/phase48-meal-instance-temporal-lifecycle
