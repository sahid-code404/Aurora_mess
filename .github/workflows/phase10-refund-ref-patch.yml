name: Tighten Refund Provenance Check

on:
  push:
    branches:
      - feat/financial-integrity-hardening
    paths:
      - scripts/patch-refund-provenance.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/financial-integrity-hardening
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/patch-refund-provenance.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/domain/ledger.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: distinguish legacy and invalid refund references"
          git push origin HEAD:feat/financial-integrity-hardening
