name: Apply Phase 9 Scope UI

on:
  push:
    branches:
      - feat/meal-selected-scope
    paths:
      - scripts/patch-phase9-scope-ui.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/meal-selected-scope
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply UI patch
        run: python3 scripts/patch-phase9-scope-ui.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/app/resident/_shared/types.ts \
                  src/components/app/resident/_shared/guest-leave-dialogs.tsx \
                  src/components/app/admin/_shared/types.ts \
                  src/components/app/admin/calendar.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: add selected meal scope controls"
          git push origin HEAD:feat/meal-selected-scope
