name: BoardOps CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: boardops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://boardops@127.0.0.1:5432/boardops_ci?schema=public
  SESSION_SECRET: boardops-ci-only-secret-not-for-production
  NODE_ENV: test

jobs:
  verify:
    name: Typecheck, lint, tests, recovery, seeded acceptance, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 22

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: boardops
          POSTGRES_DB: boardops_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boardops -d boardops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Apply committed migrations
        run: bunx prisma migrate deploy

      - name: Verify migration state
        run: bunx prisma migrate status

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Setup PostgreSQL 17 recovery client
        run: |
          mkdir -p "$RUNNER_TEMP/pg17-bin"
          cat > "$RUNNER_TEMP/pg17-bin/pg_dump" <<'EOF'
          #!/usr/bin/env bash
          exec docker run --rm --network host -v /tmp:/tmp postgres:17-alpine pg_dump "$@"
          EOF
          cat > "$RUNNER_TEMP/pg17-bin/pg_restore" <<'EOF'
          #!/usr/bin/env bash
          exec docker run --rm --network host -v /tmp:/tmp postgres:17-alpine pg_restore "$@"
          EOF
          chmod +x "$RUNNER_TEMP/pg17-bin/pg_dump" "$RUNNER_TEMP/pg17-bin/pg_restore"
          echo "$RUNNER_TEMP/pg17-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pg17-bin/pg_dump" --version
          "$RUNNER_TEMP/pg17-bin/pg_restore" --version

      - name: Deployment runtime guards
        run: bash tests/database-runtime-build.sh

      - name: Operations recovery guards
        run: bash tests/operations-runtime-guards.sh

      - name: PostgreSQL + uploads disaster-recovery drill
        run: bash tests/disaster-recovery-drill.sh

      - name: Unit regression tests
        run: bun test tests/unit

      - name: PostgreSQL financial integration tests
        run: bun test tests/integration

      - name: Development seed acceptance
        run: bun run db:seed:dev

      - name: Verify migration state after seed
        run: bunx prisma migrate status

      - name: Production build
        env:
          NODE_ENV: production
        run: bun run build

      - name: Production standalone runtime smoke
        env:
          BOARDOPS_SMOKE_DIAGNOSTIC_DIR: smoke-diagnostics
        run: bash tests/production-runtime-smoke.sh all

      - name: Seeded Admin + Resident production auth smoke
        env:
          BOARDOPS_SEEDED_SMOKE_DIAGNOSTIC_DIR: seeded-smoke-diagnostics
        run: bash tests/seeded-auth-smoke.sh

      - name: Seeded Admin + Resident production business-flow smoke
        env:
          BOARDOPS_BUSINESS_SMOKE_DIAGNOSTIC_DIR: business-smoke-diagnostics
        run: bash tests/seeded-business-flow-smoke.sh

      - name: Upload runtime smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-runtime-smoke-diagnostics
          path: |
            smoke-diagnostics/
            seeded-smoke-diagnostics/
            business-smoke-diagnostics/
          if-no-files-found: ignore
          retention-days: 3
