name: BoardOps CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: boardops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: file:./prisma/ci.db
  SESSION_SECRET: boardops-ci-only-secret-not-for-production
  NODE_ENV: test

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Unit regression tests
        run: bun test tests/unit

      - name: Prepare disposable integration database
        env:
          DATABASE_URL: file:./ci-integration.db
        run: |
          rm -f prisma/ci-integration.db
          bunx prisma db push --skip-generate

      - name: Financial integration tests
        env:
          DATABASE_URL: file:./ci-integration.db
        run: bun test tests/integration

      - name: Production build
        env:
          NODE_ENV: production
        run: bun run build
