name: BoardOps CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: boardops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://boardops@127.0.0.1:5432/boardops_ci?schema=public
  SESSION_SECRET: boardops-ci-only-secret-not-for-production
  NODE_ENV: test

jobs:
  verify:
    name: Typecheck, lint, tests, recovery, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: boardops
          POSTGRES_DB: boardops_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boardops -d boardops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Apply committed migrations
        run: bunx prisma migrate deploy

      - name: Verify migration state
        run: bunx prisma migrate status

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Setup PostgreSQL 17 recovery client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          ARCH="$(dpkg --print-architecture)"
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Architectures: ${ARCH}
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Deployment runtime guards
        run: bash tests/database-runtime-build.sh

      - name: Operations recovery guards
        run: bash tests/operations-runtime-guards.sh

      - name: PostgreSQL + uploads disaster-recovery drill
        run: bash tests/disaster-recovery-drill.sh

      - name: Unit regression tests
        run: bun test tests/unit

      - name: PostgreSQL financial integration tests
        run: bun test tests/integration

      - name: Production build
        env:
          NODE_ENV: production
        run: bun run build

      - name: Production standalone runtime smoke
        env:
          BOARDOPS_SMOKE_DIAGNOSTIC_DIR: smoke-diagnostics
        run: bash tests/production-runtime-smoke.sh all

      - name: Upload runtime smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-runtime-smoke-diagnostics
          path: smoke-diagnostics/
          if-no-files-found: ignore
          retention-days: 3
