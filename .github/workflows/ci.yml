name: BoardOps CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: boardops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://boardops@127.0.0.1:5432/boardops_ci?schema=public
  SESSION_SECRET: boardops-ci-only-secret-not-for-production
  NODE_ENV: test

jobs:
  verify:
    name: Typecheck, lint, tests, migrate, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: boardops
          POSTGRES_DB: boardops_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boardops -d boardops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Apply committed migrations
        run: bunx prisma migrate deploy

      - name: Verify migration state
        run: bunx prisma migrate status

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Deployment runtime guards
        run: bash tests/database-runtime-build.sh

      - name: Unit regression tests
        run: bun test tests/unit

      - name: PostgreSQL financial integration tests
        run: bun test tests/integration

      - name: Production build
        env:
          NODE_ENV: production
        run: bun run build

      - name: Smoke standalone process and UI
        run: bash tests/production-runtime-smoke.sh process

      - name: Smoke standalone PostgreSQL readiness
        run: bash tests/production-runtime-smoke.sh readiness

      - name: Smoke standalone auth and CSRF boundaries
        run: bash tests/production-runtime-smoke.sh auth
