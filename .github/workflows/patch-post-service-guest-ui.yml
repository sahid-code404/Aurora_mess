name: Patch post-service guest UI

on:
  push:
    branches:
      - fix/post-service-guest-meal-corrections

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-service-guest-meal-corrections
      - name: Patch Admin Meals UI
        run: python3 scripts/patch-post-service-guest-ui.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/app/admin/meals.tsx
          if git diff --cached --quiet; then
            echo "No UI changes needed"
            exit 0
          fi
          git commit -m "fix: clarify post-service guest meal corrections"
          git push origin HEAD:fix/post-service-guest-meal-corrections
