name: Phase 42 Branch Patcher

on:
  push:
    branches:
      - feat/phase42-admin-institution-time-consistency-ii

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase42-admin-institution-time-consistency-ii
          fetch-depth: 0

      - name: Apply exact institution-time substitutions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def apply(path: str, replacements: list[tuple[str, str, int]]) -> None:
              p = Path(path)
              text = p.read_text()
              for old, new, expected in replacements:
                  actual = text.count(old)
                  if actual != expected:
                      raise SystemExit(f"{path}: expected {expected} occurrence(s), found {actual}: {old[:100]!r}")
                  text = text.replace(old, new)
              p.write_text(text)

          apply("src/components/app/admin/billing.tsx", [
              (
                  'import { useApiMetaQuery, errMessage, useInvalidate, metaNum, metaStr } from "./_shared/api";\n',
                  'import { useApiMetaQuery, errMessage, useInvalidate, metaNum, metaStr } from "./_shared/api";\nimport { currentMonthKeyInTz } from "./_shared/business-date";\n',
                  1,
              ),
              (
                  'import { fmtDate, fmtDateTime, monthLabel, todayKey } from "./_shared/format";',
                  'import { fmtDate, fmtDateTime, monthLabel } from "./_shared/format";',
                  1,
              ),
              (
                  'export default function AdminBilling() {\n  const [monthParam, setMonthParam] = useState<string | undefined>(undefined);\n\n  const thisMonthKey = todayKey().slice(0, 7);',
                  'export default function AdminBilling() {\n  const [monthParam, setMonthParam] = useState<string | undefined>(undefined);\n  const { institution } = useSession();\n  const tz = institution?.timezone ?? "Asia/Kolkata";\n\n  const thisMonthKey = currentMonthKeyInTz(tz);',
                  1,
              ),
          ])

          apply("src/components/app/admin/formulas.tsx", [
              (
                  'import { errMessage, useInvalidate } from "./_shared/api";\n',
                  'import { errMessage, useInvalidate } from "./_shared/api";\nimport { currentMonthKeyInTz } from "./_shared/business-date";\n',
                  1,
              ),
              (
                  'import { monthLabel, todayKey } from "./_shared/format";',
                  'import { monthLabel } from "./_shared/format";',
                  1,
              ),
              (
                  '  const { institution } = useSession();\n\n  const thisMonthKey = todayKey().slice(0, 7);',
                  '  const { institution } = useSession();\n  const tz = institution?.timezone ?? "Asia/Kolkata";\n\n  const thisMonthKey = currentMonthKeyInTz(tz);',
                  1,
              ),
          ])

          audit = Path("src/components/app/admin/audit.tsx")
          text = audit.read_text()
          for old, new, expected in [
              (
                  'import { StaggerGroup, StaggerItem } from "@/components/glass/Stagger";\n',
                  'import { StaggerGroup, StaggerItem } from "@/components/glass/Stagger";\nimport { useSession } from "@/hooks/use-session";\n',
                  1,
              ),
              (
                  'import { useApiMetaQuery } from "./_shared/api";\n',
                  'import { useApiMetaQuery } from "./_shared/api";\nimport { currentMonthKeyInTz } from "./_shared/business-date";\n',
                  1,
              ),
              (
                  'import { fmtDateTime, todayKey } from "./_shared/format";',
                  'import { fmtDateTime } from "./_shared/format";',
                  1,
              ),
              (
                  'export default function AdminAudit() {\n  const currentMonthKey = todayKey().slice(0, 7);\n  const [monthKey, setMonthKey] = useState<string>(currentMonthKey);',
                  'export default function AdminAudit() {\n  const { institution } = useSession();\n  const tz = institution?.timezone ?? "Asia/Kolkata";\n  const currentMonthKey = currentMonthKeyInTz(tz);\n  const [monthParam, setMonthParam] = useState<string | undefined>(undefined);\n  const monthKey = monthParam ?? currentMonthKey;',
                  1,
              ),
          ]:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"audit.tsx: expected {expected}, found {actual}: {old[:100]!r}")
              text = text.replace(old, new)
          if text.count("setMonthKey(") != 3:
              raise SystemExit(f"audit.tsx: expected 3 setMonthKey handlers, found {text.count('setMonthKey(')}")
          text = text.replace("setMonthKey(", "setMonthParam(")
          if text.count("setMonthParam(currentMonthKey)") != 1:
              raise SystemExit("audit.tsx: current-month reset shape changed")
          text = text.replace("setMonthParam(currentMonthKey)", "setMonthParam(undefined)")
          audit.write_text(text)

          announcements = Path("src/components/app/admin/announcements.tsx")
          text = announcements.read_text()
          for old, new, expected in [
              (
                  'import { errMessage, useInvalidate } from "./_shared/api";\n',
                  'import { errMessage, useInvalidate } from "./_shared/api";\nimport { currentMonthKeyInTz } from "./_shared/business-date";\n',
                  1,
              ),
              (
                  'import { fmtDateTime, todayKey } from "./_shared/format";',
                  'import { fmtDateTime } from "./_shared/format";',
                  1,
              ),
              (
                  'export default function AdminAnnouncements() {\n  const currentMonthKey = todayKey().slice(0, 7);\n  const [monthKey, setMonthKey] = useState<string>(currentMonthKey);',
                  'export default function AdminAnnouncements() {\n  const { institution } = useSession();\n  const tz = institution?.timezone ?? "Asia/Kolkata";\n  const currentMonthKey = currentMonthKeyInTz(tz);\n  const [monthParam, setMonthParam] = useState<string | undefined>(undefined);\n  const monthKey = monthParam ?? currentMonthKey;',
                  1,
              ),
              (
                  '  const invalidate = useInvalidate();\n  const { institution } = useSession();\n  const tz = institution?.timezone ?? "Asia/Kolkata";',
                  '  const invalidate = useInvalidate();',
                  1,
              ),
          ]:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"announcements.tsx: expected {expected}, found {actual}: {old[:100]!r}")
              text = text.replace(old, new)
          if text.count("setMonthKey(") != 3:
              raise SystemExit(f"announcements.tsx: expected 3 setMonthKey handlers, found {text.count('setMonthKey(')}")
          text = text.replace("setMonthKey(", "setMonthParam(")
          if text.count("setMonthParam(currentMonthKey)") != 1:
              raise SystemExit("announcements.tsx: current-month reset shape changed")
          text = text.replace("setMonthParam(currentMonthKey)", "setMonthParam(undefined)")
          announcements.write_text(text)

          apply("src/components/app/admin/expenses.tsx", [
              (
                  'import { useApiMetaQuery, errMessage, useInvalidate, metaNum, metaStr } from "./_shared/api";\n',
                  'import { useApiMetaQuery, errMessage, useInvalidate, metaNum, metaStr } from "./_shared/api";\nimport { currentMonthKeyInTz, todayKeyInTz } from "./_shared/business-date";\n',
                  1,
              ),
              (
                  'import { fmtDate, fmtDateTime, fmtMinor, monthLabel, parseMoneyToMinor, todayKey } from "./_shared/format";',
                  'import { fmtDate, fmtDateTime, fmtMinor, monthLabel, parseMoneyToMinor } from "./_shared/format";',
                  1,
              ),
              (
                  'function ExpenseFormDialog({\n  open,\n  onOpenChange,\n  categories,\n  onSaved,\n}: {\n  open: boolean;\n  onOpenChange: (open: boolean) => void;\n  categories: ExpenseCategory[];\n  onSaved: () => void;\n}) {\n  const [date, setDate] = useState(todayKey());',
                  'function ExpenseFormDialog({\n  open,\n  onOpenChange,\n  categories,\n  defaultDate,\n  onSaved,\n}: {\n  open: boolean;\n  onOpenChange: (open: boolean) => void;\n  categories: ExpenseCategory[];\n  defaultDate: string;\n  onSaved: () => void;\n}) {\n  const [date, setDate] = useState(defaultDate);',
                  1,
              ),
              (
                  '  const fileRef = useRef<HTMLInputElement | null>(null);\n\n  const estimate = useMemo(() => {',
                  '  const fileRef = useRef<HTMLInputElement | null>(null);\n\n  useEffect(() => {\n    if (open) setDate(defaultDate);\n  }, [open, defaultDate]);\n\n  const estimate = useMemo(() => {',
                  1,
              ),
              (
                  '  const thisMonthKey = todayKey().slice(0, 7);',
                  '  const thisMonthKey = currentMonthKeyInTz(tz);',
                  1,
              ),
              (
                  '      <ExpenseFormDialog\n        open={formOpen}\n        onOpenChange={setFormOpen}\n        categories={categories}\n        onSaved={() => invalidate([EXPENSES_PATH, "/api/v1/admin/dashboard"])}',
                  '      <ExpenseFormDialog\n        open={formOpen}\n        onOpenChange={setFormOpen}\n        categories={categories}\n        defaultDate={todayKeyInTz(tz)}\n        onSaved={() => invalidate([EXPENSES_PATH, "/api/v1/admin/dashboard"])}',
                  1,
              ),
          ])

          calendar = Path("src/components/app/admin/calendar.tsx")
          text = calendar.read_text()
          for old, new, expected in [
              (
                  'import { useApiQuery, postJson, deleteJson } from "@/hooks/use-api-query";\n',
                  'import { useApiQuery, postJson, deleteJson } from "@/hooks/use-api-query";\nimport { useSession } from "@/hooks/use-session";\n',
                  1,
              ),
              (
                  'import { errMessage, useInvalidate } from "./_shared/api";\n',
                  'import { errMessage, useInvalidate } from "./_shared/api";\nimport { todayKeyInTz } from "./_shared/business-date";\n',
                  1,
              ),
              (
                  'import { fmtDate, todayKey, initialsOf } from "./_shared/format";',
                  'import { fmtDate, initialsOf } from "./_shared/format";',
                  1,
              ),
              (
                  'export default function AdminCalendar() {\n  const now = new Date();\n  const [year, setYear] = useState(now.getFullYear());\n  const [month, setMonth] = useState(now.getMonth() + 1);',
                  'export default function AdminCalendar() {\n  const { institution } = useSession();\n  const tz = institution?.timezone ?? "Asia/Kolkata";\n  const serverToday = todayKeyInTz(tz);\n  const currentMonthKey = serverToday.slice(0, 7);\n  const [monthParam, setMonthParam] = useState<string | undefined>(undefined);\n  const activeMonthKey = monthParam ?? currentMonthKey;\n  const year = Number(activeMonthKey.slice(0, 4));\n  const month = Number(activeMonthKey.slice(5, 7));',
                  1,
              ),
              (
                  '  const leaveRequests = Array.isArray(allLeaves) ? allLeaves : [];\n  const serverToday = todayKey();',
                  '  const leaveRequests = Array.isArray(allLeaves) ? allLeaves : [];',
                  1,
              ),
              (
                  '  const isCurrentMonth = `${year}-${pad2(month)}` === serverToday.slice(0, 7);\n\n  function shiftMonth(delta: number) {\n    setSelectedDay(null);\n    let m = month + delta;\n    let y = year;\n    if (m < 1) {\n      m = 12;\n      y -= 1;\n    } else if (m > 12) {\n      m = 1;\n      y += 1;\n    }\n    setMonth(m);\n    setYear(y);\n  }\n\n  /** Picker pill → jump back to the current month. */\n  function resetToCurrentMonth() {\n    const [tY, tM] = serverToday.split("-").map(Number);\n    if (tY === year && tM === month) return;\n    setYear(tY);\n    setMonth(tM);\n    setSelectedDay(null);\n  }',
                  '  const isCurrentMonth = activeMonthKey === currentMonthKey;\n\n  function shiftMonth(delta: number) {\n    setSelectedDay(null);\n    let m = month + delta;\n    let y = year;\n    if (m < 1) {\n      m = 12;\n      y -= 1;\n    } else if (m > 12) {\n      m = 1;\n      y += 1;\n    }\n    setMonthParam(`${y}-${pad2(m)}`);\n  }\n\n  /** Picker pill → jump back to the current month. */\n  function resetToCurrentMonth() {\n    if (isCurrentMonth) return;\n    setMonthParam(undefined);\n    setSelectedDay(null);\n  }',
                  1,
              ),
          ]:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"calendar.tsx: expected {expected}, found {actual}: {old[:100]!r}")
              text = text.replace(old, new)
          calendar.write_text(text)

          test_path = Path("tests/unit/admin-institution-time-source-ii.test.ts")
          test_path.write_text('''import { describe, expect, test } from "bun:test";\nimport { readFileSync } from "node:fs";\n\nfunction source(path: string): string {\n  return readFileSync(new URL(`../../${path}`, import.meta.url), "utf8");\n}\n\nconst paths = [\n  "src/components/app/admin/audit.tsx",\n  "src/components/app/admin/announcements.tsx",\n  "src/components/app/admin/billing.tsx",\n  "src/components/app/admin/expenses.tsx",\n  "src/components/app/admin/formulas.tsx",\n  "src/components/app/admin/calendar.tsx",\n];\n\ndescribe("admin institution-time source contracts II", () => {\n  test("remaining month-scoped admin pages use institution current month", () => {\n    for (const path of paths.slice(0, 5)) {\n      const text = source(path);\n      expect(text).toContain("currentMonthKeyInTz(tz)");\n      expect(text).not.toContain("todayKey().slice(0, 7)");\n    }\n  });\n\n  test("Audit and Announcements derive current month after session hydration", () => {\n    for (const path of [paths[0], paths[1]]) {\n      const text = source(path);\n      expect(text).toContain("const [monthParam, setMonthParam] = useState<string | undefined>(undefined);");\n      expect(text).toContain("const monthKey = monthParam ?? currentMonthKey;");\n      expect(text).toContain("setMonthParam(undefined)");\n      expect(text).not.toContain("useState<string>(currentMonthKey)");\n    }\n  });\n\n  test("Expense defaults financial date from institution business day", () => {\n    const expenses = source(paths[3]);\n    expect(expenses).toContain("defaultDate={todayKeyInTz(tz)}");\n    expect(expenses).toContain("if (open) setDate(defaultDate);");\n    expect(expenses).toContain("const thisMonthKey = currentMonthKeyInTz(tz);");\n    expect(expenses).not.toContain("useState(todayKey())");\n  });\n\n  test("Calendar follows institution today and a derived current month", () => {\n    const calendar = source(paths[5]);\n    expect(calendar).toContain("const serverToday = todayKeyInTz(tz);");\n    expect(calendar).toContain("const activeMonthKey = monthParam ?? currentMonthKey;");\n    expect(calendar).toContain("setMonthParam(undefined)");\n    expect(calendar).not.toContain("const now = new Date();");\n    expect(calendar).not.toContain("const serverToday = todayKey();");\n  });\n\n  test("browser-local current-day helper is absent from business-date pages", () => {\n    for (const path of paths) {\n      expect(source(path)).not.toContain("todayKey()");\n    }\n  });\n});\n''')
          PY

      - name: Commit patched source and regression guards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/app/admin tests/unit/admin-institution-time-source-ii.test.ts
          git diff --cached --check
          git commit -m "Phase 42: finish Admin institution-time consistency"
          git push origin HEAD:feat/phase42-admin-institution-time-consistency-ii
