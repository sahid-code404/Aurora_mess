name: Phase 24 payment UI patch

on:
  push:
    branches: [feat/phase24-payment-withdrawal]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase24-payment-withdrawal
          fetch-depth: 0

      - name: Apply resident payment UI patch
        run: python3 scripts/phase24-payment-ui-patch.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Commit UI patch if needed
        run: |
          if git diff --quiet; then
            echo "No UI patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/app/resident/payments.tsx
          git commit -m "Phase 24: add pending payment withdrawal UI"
          git push origin HEAD:feat/phase24-payment-withdrawal
