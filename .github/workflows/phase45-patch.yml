name: Phase 45 guarded patch

on:
  push:
    branches:
      - feat/phase45-refund-correction-lifecycle
    paths:
      - scripts/phase45_patch.py
      - .github/workflows/phase45-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase45-refund-correction-lifecycle
          fetch-depth: 0
      - name: Apply assertion-guarded patch
        run: python3 scripts/phase45_patch.py
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            prisma/schema.prisma \
            prisma/migrations/20260906_070000_add_refund_correction_lifecycle/migration.sql \
            src/lib/errors.ts \
            src/lib/domain/serialize.ts \
            src/lib/domain/refund-correction.ts \
            src/lib/domain/ledger.ts \
            src/app/api/v1/admin/refunds/route.ts \
            src/app/api/v1/admin/refunds/[id]/void/route.ts \
            src/components/app/admin/payments.tsx \
            src/components/app/resident/_shared/types.ts \
            src/components/app/resident/payments.tsx \
            src/app/api/v1/admin/residents/[id]/route.ts \
            src/components/app/admin/_shared/types.ts \
            src/components/app/admin/resident360.tsx
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "Phase 45: complete refund correction lifecycle"
            git push origin HEAD:feat/phase45-refund-correction-lifecycle
          fi
