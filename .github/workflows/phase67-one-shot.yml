name: Phase 67 one-shot patch

on:
  push:
    branches:
      - feat/phase67-final-state-contract-closure
    paths:
      - .github/workflows/phase67-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase67-final-state-contract-closure
          fetch-depth: 0
      - name: Apply reviewed Phase 67 patch
        run: python3 scripts/audit_phase67_apply.py
      - name: Remove one-shot helpers
        run: |
          rm scripts/audit_phase67_apply.py
          rm .github/workflows/phase67-one-shot.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close final formula and billing state contracts"
          git push origin HEAD:feat/phase67-final-state-contract-closure
