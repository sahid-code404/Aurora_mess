name: Phase 45 settlement fix

on:
  push:
    branches:
      - feat/phase45-refund-correction-lifecycle
    paths:
      - scripts/phase45_settlement_fix.py
      - .github/workflows/phase45-settlement-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase45-refund-correction-lifecycle
          fetch-depth: 0
      - name: Apply refund-aware settlement fix
        run: python3 scripts/phase45_settlement_fix.py
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/domain/funds.ts
          git commit -m "Phase 45: make FIFO settlement refund-aware"
          git push origin HEAD:feat/phase45-refund-correction-lifecycle
