name: Phase66 Schema Fix
on:
  push:
    branches: [feat/phase66-archive-lifecycle-integrity]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[phase66-schema-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase66-archive-lifecycle-integrity
      - name: Fix schema index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('prisma/schema.prisma')
          s = p.read_text()
          old = '@@index([institutionId, policyType, status])'
          new = '@@index([institutionId, policyType])'
          if s.count(old) != 1:
              raise SystemExit(f'expected one old RuleDefinition index, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit schema fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/schema.prisma
          git commit -m 'phase66: remove dead RuleDefinition status index [phase66-schema-fixed]'
          git push origin HEAD:feat/phase66-archive-lifecycle-integrity
