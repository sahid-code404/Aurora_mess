name: Phase 45 refinement patch

on:
  push:
    branches:
      - feat/phase45-refund-correction-lifecycle
    paths:
      - scripts/phase45_refine.py
      - .github/workflows/phase45-refine.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase45-refund-correction-lifecycle
          fetch-depth: 0
      - name: Apply guarded refinements
        run: python3 scripts/phase45_refine.py
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            prisma/schema.prisma \
            prisma/migrations/20260906_070000_add_refund_correction_lifecycle/migration.sql \
            src/lib/domain/refund-correction.ts \
            src/lib/domain/ledger.ts \
            src/components/app/admin/payments.tsx
          if git diff --cached --quiet; then
            echo "No refinement changes to commit"
          else
            git commit -m "Phase 45: tighten refund correction invariants"
            git push origin HEAD:feat/phase45-refund-correction-lifecycle
          fi
