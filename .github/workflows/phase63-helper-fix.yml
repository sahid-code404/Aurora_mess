name: Phase 63 Helper Fix

on:
  push:
    branches:
      - feat/phase63-finite-policy-exemptions
    paths:
      - .github/workflows/phase63-helper-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase63-finite-policy-exemptions
          fetch-depth: 0
      - name: Narrow guard and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/phase63-finite-policy-exemptions.yml')
          lines = p.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if 'if grep -R --line-number' in line and 'expiresAt: null' in line]
          if len(matches) != 1:
              raise SystemExit(f'expected one broad exemption guard, found {len(matches)}')
          i = matches[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i] = indent + "if grep -n 'OR: \\[{ expiresAt: null }' src/lib/domain/policy-exemption.ts src/lib/domain/funds.ts src/app/api/v1/admin/funds/route.ts src/app/api/v1/admin/policy-exemptions/route.ts; then"
          p.write_text('\n'.join(lines) + '\n')
          Path('.github/workflows/phase63-helper-fix.yml').unlink()
          PY
          git diff --check
          git config user.name "BoardOps Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: scope finite exemption verification"
          git push origin HEAD:feat/phase63-finite-policy-exemptions
