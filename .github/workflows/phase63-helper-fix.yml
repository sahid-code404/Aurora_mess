name: Phase 63 Helper Fix

on:
  push:
    branches:
      - feat/phase63-finite-policy-exemptions
    paths:
      - .github/workflows/phase63-helper-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase63-finite-policy-exemptions
          fetch-depth: 0
      - name: Narrow guard and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/phase63-finite-policy-exemptions.yml')
          text = p.read_text()
          old = "if grep -R --line-number --exclude-dir=tool-results --exclude-dir=upload 'OR: \\\[{ expiresAt: null }' src; then\n"
          new = "if grep -n 'OR: \\\[{ expiresAt: null }' src/lib/domain/policy-exemption.ts src/lib/domain/funds.ts src/app/api/v1/admin/funds/route.ts src/app/api/v1/admin/policy-exemptions/route.ts; then\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one broad exemption guard, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/phase63-helper-fix.yml').unlink()
          PY
          git diff --check
          git config user.name "BoardOps Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: scope finite exemption verification"
          git push origin HEAD:feat/phase63-finite-policy-exemptions
