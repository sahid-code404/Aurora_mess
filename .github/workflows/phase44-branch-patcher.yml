name: Phase 44 Branch Patcher

on:
  push:
    branches:
      - feat/phase44-refund-payment-lifecycle-coherence

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase44-refund-payment-lifecycle-coherence
          fetch-depth: 0
      - name: Apply exact substitutions
        run: python3 .github/phase44_patch.py
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma src
          git diff --cached --check
          git commit -m "Phase 44: align pooled refunds with payment lifecycle"
          git push origin HEAD:feat/phase44-refund-payment-lifecycle-coherence
