name: Phase 44 Branch Patcher

on:
  push:
    branches:
      - feat/phase44-refund-payment-lifecycle-coherence

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase44-refund-payment-lifecycle-coherence
          fetch-depth: 0
      - name: Apply exact substitutions
        shell: bash
        run: |
          set +e
          python3 .github/phase44_patch.py > /tmp/phase44-patch.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/phase44-patch.log .github/phase44_patch_error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/phase44_patch_error.txt
            git commit -m "Phase 44: record patch assertion failure"
            git push origin HEAD:feat/phase44-refund-payment-lifecycle-coherence
            exit "$code"
          fi
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma src
          git diff --cached --check
          git commit -m "Phase 44: align pooled refunds with payment lifecycle"
          git push origin HEAD:feat/phase44-refund-payment-lifecycle-coherence
