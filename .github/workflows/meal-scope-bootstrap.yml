name: Bootstrap Selected Meal Scope

on:
  push:
    branches: [feat/meal-selected-scope]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[meal-scope-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: boardops
          POSTGRES_DB: boardops_meal_scope
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boardops -d boardops_meal_scope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://boardops@127.0.0.1:5432/boardops_meal_scope?schema=public

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/meal-selected-scope
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Patch and validate Prisma schema
        run: |
          python3 scripts/bootstrap-meal-scope-schema.py
          bunx prisma format
          bunx prisma validate

      - name: Apply current committed migrations
        run: bunx prisma migrate deploy

      - name: Generate additive selected-meal migration
        run: |
          mkdir -p prisma/migrations/20260905_020000_add_selected_meal_scope
          bunx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script > prisma/migrations/20260905_020000_add_selected_meal_scope/migration.sql
          test -s prisma/migrations/20260905_020000_add_selected_meal_scope/migration.sql

      - name: Commit generated schema and migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma prisma/migrations/20260905_020000_add_selected_meal_scope/migration.sql
          git commit -m "infra: add selected meal leave and calendar scope [meal-scope-generated]"
          git push origin HEAD:feat/meal-selected-scope
