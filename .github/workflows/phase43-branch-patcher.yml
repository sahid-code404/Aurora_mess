name: Phase 43 Branch Patcher

on:
  push:
    branches:
      - feat/phase43-atomic-task-lifecycle-cancellation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase43-atomic-task-lifecycle-cancellation
          fetch-depth: 0

      - name: Apply exact task lifecycle substitutions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def apply(path: str, replacements: list[tuple[str, str, int]]) -> None:
              p = Path(path)
              text = p.read_text()
              for old, new, expected in replacements:
                  actual = text.count(old)
                  if actual != expected:
                      raise SystemExit(f"{path}: expected {expected}, found {actual}: {old[:120]!r}")
                  text = text.replace(old, new)
              p.write_text(text)

          for path in [
              "src/app/api/v1/tasks/[id]/accept/route.ts",
              "src/app/api/v1/tasks/[id]/reject/route.ts",
              "src/app/api/v1/tasks/[id]/start/route.ts",
          ]:
              apply(path, [
                  (
                      'import { requireInstitutionContext } from "@/lib/domain/meal-engine";\n',
                      'import { requireInstitutionContext } from "@/lib/domain/meal-engine";\nimport { lockTaskLifecycleMutation } from "@/lib/domain/task-lifecycle";\n',
                      1,
                  ),
                  (
                      '  const result = await db.$transaction(async (tx) => {\n    const task = await tx.task.findFirst({',
                      '  const result = await db.$transaction(async (tx) => {\n    await lockTaskLifecycleMutation(tx, ctx.institutionId, ctx.params.id);\n\n    const task = await tx.task.findFirst({',
                      1,
                  ),
              ])

          apply("src/app/api/v1/tasks/[id]/submission/route.ts", [
              (
                  'import { lockInstitutionFinancialMutation } from "@/lib/domain/financial-lock";\n',
                  'import { lockInstitutionFinancialMutation } from "@/lib/domain/financial-lock";\nimport { lockTaskLifecycleMutation } from "@/lib/domain/task-lifecycle";\n',
                  1,
              ),
              (
                  '        await lockInstitutionFinancialMutation(tx, ctx.institutionId);\n\n        const task = await tx.task.findFirst({',
                  '        await lockInstitutionFinancialMutation(tx, ctx.institutionId);\n        await lockTaskLifecycleMutation(tx, ctx.institutionId, ctx.params.id);\n\n        const task = await tx.task.findFirst({',
                  1,
              ),
              (
                  ' * ASSIGNED → ACCEPTED → IN_PROGRESS → SUBMITTED → APPROVED/REJECTED_BY_ADMIN.\n',
                  ' * ASSIGNED → ACCEPTED → IN_PROGRESS → SUBMITTED → APPROVED/REJECTED_BY_ADMIN,\n * with Admin cancellation allowed from active pre-submission states.\n',
                  1,
              ),
          ])

          apply("src/components/glass/StatusBadge.tsx", [
              (
                  '  REJECTED_BY_ADMIN: "danger",\n  COMPLETED: "success",',
                  '  REJECTED_BY_ADMIN: "danger",\n  CANCELLED: "neutral",\n  COMPLETED: "success",',
                  1,
              ),
              (
                  '  REJECTED_BY_ADMIN: "Rejected by admin",\n  COMPLETED: "Completed",',
                  '  REJECTED_BY_ADMIN: "Rejected by admin",\n  CANCELLED: "Cancelled",\n  COMPLETED: "Completed",',
                  1,
              ),
          ])

          admin = Path("src/components/app/admin/tasks.tsx")
          text = admin.read_text()
          replacements = [
              (
                  '  { value: "APPROVED", label: "Completed" },\n  { value: "REJECTED", label: "Rejected" },\n];',
                  '  { value: "APPROVED", label: "Completed" },\n  { value: "REJECTED", label: "Resident Rejected" },\n  { value: "REJECTED_BY_ADMIN", label: "Review Rejected" },\n  { value: "CANCELLED", label: "Cancelled" },\n];',
                  1,
              ),
              (
                  '  REJECTED: "border-danger/30 bg-danger/12 text-danger",\n  REJECTED_BY_ADMIN: "border-danger/30 bg-danger/12 text-danger",\n};',
                  '  REJECTED: "border-danger/30 bg-danger/12 text-danger",\n  REJECTED_BY_ADMIN: "border-danger/30 bg-danger/12 text-danger",\n  CANCELLED: "border-border bg-muted/60 text-muted-foreground",\n};',
                  1,
              ),
              (
                  '    case "REJECTED":\n    case "REJECTED_BY_ADMIN":\n      return "rose";',
                  '    case "REJECTED":\n    case "REJECTED_BY_ADMIN":\n      return "rose";\n    case "CANCELLED":\n      return "frost";',
                  1,
              ),
              (
                  '  const currentMonthKey = currentMonthKeyInTz(tz);\n  const [monthKey, setMonthKey] = useState<string>(currentMonthKey);',
                  '  const currentMonthKey = currentMonthKeyInTz(tz);\n  const [monthParam, setMonthParam] = useState<string | undefined>(undefined);\n  const monthKey = monthParam ?? currentMonthKey;',
                  1,
              ),
              (
                  '  const canReview = currentTask.status === "SUBMITTED" && sub && sub.status === "SUBMITTED";\n',
                  '  const canReview = currentTask.status === "SUBMITTED" && sub && sub.status === "SUBMITTED";\n  const canCancel = ["ASSIGNED", "ACCEPTED", "IN_PROGRESS"].includes(currentTask.status);\n',
                  1,
              ),
              (
                  '          ) : (\n            <GlassButton variant="ghost" onClick={onClose}>\n              Close\n            </GlassButton>\n          )',
                  '          ) : (\n            <>\n              <GlassButton variant="ghost" onClick={onClose}>\n                Close\n              </GlassButton>\n              {canCancel && (\n                <TaskCancelAction\n                  task={currentTask}\n                  onDone={() => {\n                    onReviewDone();\n                    onClose();\n                  }}\n                />\n              )}\n            </>\n          )',
                  1,
              ),
              (
                  '              {currentTask.notes && <KeyValue label="Notes" value={currentTask.notes} />}\n',
                  '              {currentTask.notes && <KeyValue label="Notes" value={currentTask.notes} />}\n              {currentTask.status === "CANCELLED" && currentTask.adminReviewReason && (\n                <KeyValue label="Cancellation reason" value={currentTask.adminReviewReason} />\n              )}\n',
                  1,
              ),
              (
                  '/* ------------------------------------------------------------ review card */\n\nfunction SubmissionReviewCard',
                  '''function TaskCancelAction({ task, onDone }: { task: TaskRow; onDone: () => void }) {\n  const [open, setOpen] = useState(false);\n  const [acting, setActing] = useState(false);\n\n  async function cancel(reason?: string) {\n    if (!reason) return;\n    setActing(true);\n    try {\n      await postJson(`${TASKS_PATH}/${task.id}/cancel`, { reason });\n      toast.success("Task cancelled", { description: `${task.residentName} · ${task.description}` });\n      setOpen(false);\n      onDone();\n    } catch (err) {\n      toast.error(errMessage(err));\n    } finally {\n      setActing(false);\n    }\n  }\n\n  return (\n    <>\n      <GlassButton variant="destructive" icon={<XCircle className="size-4" />} onClick={() => setOpen(true)} disabled={acting}>\n        Cancel task…\n      </GlassButton>\n      {open && (\n        <ConfirmDialog\n          open\n          onOpenChange={(next) => !next && setOpen(false)}\n          title="Cancel task"\n          description={`Cancel \"${task.description}\" for ${task.residentName}? Submitted/completed work cannot be cancelled.`}\n          confirmLabel="Cancel task"\n          tone="destructive"\n          requireReason\n          reasonPlaceholder="Why is this task being cancelled? (required)"\n          loading={acting}\n          onConfirm={(reason) => void cancel(reason)}\n        />\n      )}\n    </>\n  );\n}\n\n/* ------------------------------------------------------------ review card */\n\nfunction SubmissionReviewCard''',
                  1,
              ),
          ]
          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"admin/tasks.tsx: expected {expected}, found {actual}: {old[:120]!r}")
              text = text.replace(old, new)
          if text.count("setMonthKey(") != 3:
              raise SystemExit(f"admin/tasks.tsx: expected 3 month handlers, found {text.count('setMonthKey(')}")
          text = text.replace("setMonthKey(", "setMonthParam(")
          if text.count("setMonthParam(currentMonthKey)") != 1:
              raise SystemExit("admin/tasks.tsx: current-month reset shape changed")
          text = text.replace("setMonthParam(currentMonthKey)", "setMonthParam(undefined)")
          admin.write_text(text)

          resident = Path("src/components/app/resident/tasks.tsx")
          text = resident.read_text()
          replacements = [
              (
                  '    case "REJECTED":\n    case "REJECTED_BY_ADMIN":\n      return "rose";',
                  '    case "REJECTED":\n    case "REJECTED_BY_ADMIN":\n      return "rose";\n    case "CANCELLED":\n      return "frost";',
                  1,
              ),
              (
                  '  { value: "APPROVED", label: "Completed" },\n  { value: "REJECTED", label: "Rejected" },\n];',
                  '  { value: "APPROVED", label: "Completed" },\n  { value: "REJECTED", label: "Declined" },\n  { value: "REJECTED_BY_ADMIN", label: "Admin Rejected" },\n  { value: "CANCELLED", label: "Cancelled" },\n];',
                  1,
              ),
              (
                  '          {/* Visual lifecycle stepper */}\n          <TaskProgressStepper status={task.status} />',
                  '          {/* Visual lifecycle stepper */}\n          {task.status !== "CANCELLED" && <TaskProgressStepper status={task.status} />}',
                  1,
              ),
              (
                  '    task.status !== "APPROVED" &&\n    task.status !== "REJECTED" &&\n    task.dueDate! < todayKey;',
                  '    task.status !== "APPROVED" &&\n    task.status !== "REJECTED" &&\n    task.status !== "REJECTED_BY_ADMIN" &&\n    task.status !== "CANCELLED" &&\n    task.dueDate! < todayKey;',
                  1,
              ),
              (
                  '          {(task.status === "REJECTED" || task.status === "REJECTED_BY_ADMIN") && (',
                  '          {(task.status === "REJECTED" || task.status === "REJECTED_BY_ADMIN" || task.status === "CANCELLED") && (',
                  1,
              ),
              (
                  '{task.status === "REJECTED" ? "You Declined This Task" : "Submission Rejected by Admin"}',
                  '{task.status === "REJECTED"\n                    ? "You Declined This Task"\n                    : task.status === "CANCELLED"\n                      ? "Task Cancelled by Admin"\n                      : "Submission Rejected by Admin"}',
                  1,
              ),
              (
                  '{task.status === "REJECTED"\n                    ? task.rejectionReason ?? "No reason provided."\n                    : task.adminReviewReason ?? "No review reason provided."}',
                  '{task.status === "REJECTED"\n                    ? task.rejectionReason ?? "No reason provided."\n                    : task.adminReviewReason ?? (task.status === "CANCELLED" ? "No cancellation reason provided." : "No review reason provided.")}',
                  1,
              ),
              (
                  '  const currentMonthKey = todayKeyInTz(tz).slice(0, 7);\n  const [monthKey, setMonthKey] = useState<string>(currentMonthKey);',
                  '  const currentMonthKey = todayKeyInTz(tz).slice(0, 7);\n  const [monthParam, setMonthParam] = useState<string | undefined>(undefined);\n  const monthKey = monthParam ?? currentMonthKey;',
                  1,
              ),
              (
                  '      const finished =\n        t.status === "APPROVED" || t.status === "REJECTED" || t.status === "REJECTED_BY_ADMIN";\n      if (!finished && t.dueDate && t.dueDate < todayKey) overdue += 1;',
                  '      const finished =\n        t.status === "APPROVED" ||\n        t.status === "REJECTED" ||\n        t.status === "REJECTED_BY_ADMIN" ||\n        t.status === "CANCELLED";\n      if (!finished && t.dueDate && t.dueDate < todayKey) overdue += 1;',
                  1,
              ),
          ]
          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"resident/tasks.tsx: expected {expected}, found {actual}: {old[:120]!r}")
              text = text.replace(old, new)
          if text.count("setMonthKey(") != 3:
              raise SystemExit(f"resident/tasks.tsx: expected 3 month handlers, found {text.count('setMonthKey(')}")
          text = text.replace("setMonthKey(", "setMonthParam(")
          if text.count("setMonthParam(currentMonthKey)") != 1:
              raise SystemExit("resident/tasks.tsx: current-month reset shape changed")
          text = text.replace("setMonthParam(currentMonthKey)", "setMonthParam(undefined)")
          resident.write_text(text)

          apply("src/components/app/resident/_shared/icons.tsx", [
              (
                  '  TASK_REJECTED: TriangleAlert,\n',
                  '  TASK_REJECTED: TriangleAlert,\n  TASK_CANCELLED: TriangleAlert,\n',
                  1,
              ),
          ])
          PY

      - name: Commit patched task lifecycle source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/v1/tasks src/components/app/admin/tasks.tsx src/components/app/resident/tasks.tsx src/components/app/resident/_shared/icons.tsx src/components/glass/StatusBadge.tsx
          git diff --cached --check
          git commit -m "Phase 43: serialize and surface task lifecycle"
          git push origin HEAD:feat/phase43-atomic-task-lifecycle-cancellation
