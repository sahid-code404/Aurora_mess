name: Patch guest correction badge

on:
  push:
    branches:
      - fix/post-service-guest-meal-corrections

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-service-guest-meal-corrections
      - name: Patch correction badge parser
        run: python3 scripts/patch-guest-correction-badge.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/v1/admin/meals/route.ts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: surface post-service guest corrections"
          git push origin HEAD:fix/post-service-guest-meal-corrections
