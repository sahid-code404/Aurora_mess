name: Phase 17 seed cleanup patch

on:
  push:
    branches: [test/phase17-seeded-acceptance-v2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/phase17-seeded-acceptance-v2
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/phase17-seed-wipe-patch.py

      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/seed.ts
          git commit -m "Phase 17: make development seed cleanup current-schema safe"
          git push origin HEAD:test/phase17-seeded-acceptance-v2
